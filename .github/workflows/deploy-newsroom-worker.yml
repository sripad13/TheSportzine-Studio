name: Deploy Newsroom Worker

on:
  push:
    branches:
      - main
    paths:
      - "newsroom-worker.js"
      - "wrangler.toml"
      - "newsroom-schema.sql"
      - ".github/workflows/deploy-newsroom-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: thesportzine-newsroom
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4

      # `wrangler deploy` replaces every binding with what wrangler.toml declares, so a D1
      # binding added by hand in the Cloudflare dashboard is dropped on each deploy.
      # This step finds (or creates) the Newsroom database and adds the binding at deploy time.
      # If the API token lacks D1 permission, the Worker still deploys without a database.
      - name: Attach D1 database
        id: d1
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -q '^\[\[d1_databases\]\]' wrangler.toml; then
            echo "wrangler.toml already declares a D1 binding; leaving it as is."
            echo "name=$(grep -A3 '^\[\[d1_databases\]\]' wrangler.toml | sed -n 's/^database_name *= *"\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wrangler d1 list --json > d1-list.json
          DB_JSON=$(node -e '
            const list = JSON.parse(require("fs").readFileSync("d1-list.json", "utf8"));
            const want = process.env.D1_NAME;
            const pick = list.find(d => d.name === want) || list.find(d => /newsroom/i.test(d.name));
            process.stdout.write(pick ? JSON.stringify({ name: pick.name, id: pick.uuid || pick.id }) : "");
          ')
          if [ -z "$DB_JSON" ]; then
            echo "No Newsroom D1 database found; creating $D1_NAME."
            # Run outside the repo so Wrangler cannot edit wrangler.toml itself.
            mkdir -p "$RUNNER_TEMP/d1" && npx wrangler d1 create "$D1_NAME" --location apac --cwd "$RUNNER_TEMP/d1"
            npx wrangler d1 list --json > d1-list.json
            DB_JSON=$(node -e '
              const list = JSON.parse(require("fs").readFileSync("d1-list.json", "utf8"));
              const pick = list.find(d => d.name === process.env.D1_NAME);
              process.stdout.write(pick ? JSON.stringify({ name: pick.name, id: pick.uuid || pick.id }) : "");
            ')
          fi
          [ -n "$DB_JSON" ] || { echo "Could not resolve the D1 database id."; exit 1; }
          DB_NAME=$(node -pe 'JSON.parse(process.argv[1]).name' "$DB_JSON")
          DB_ID=$(node -pe 'JSON.parse(process.argv[1]).id' "$DB_JSON")
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\n' "$DB_NAME" "$DB_ID" >> wrangler.toml
          echo "Using D1 database $DB_NAME ($DB_ID)."
          echo "name=$DB_NAME" >> "$GITHUB_OUTPUT"

      - name: Apply Newsroom schema
        if: steps.d1.outcome == 'success' && steps.d1.outputs.name != ''
        continue-on-error: true
        run: npx wrangler d1 execute "${{ steps.d1.outputs.name }}" --remote --yes --file newsroom-schema.sql

      - name: Warn when deploying without D1
        if: steps.d1.outcome != 'success'
        run: echo "::warning::D1 could not be attached (check the API token has D1 Edit permission). Deploying without a database; sources are read-only and saved stories stay in each browser."

      - name: Deploy Newsroom Worker
        run: npx wrangler deploy --config wrangler.toml
