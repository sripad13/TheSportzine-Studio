name: Deploy Link Worker

on:
  push:
    branches:
      - main
    paths:
      - "link-worker.js"
      - "link-wrangler.toml"
      - ".github/workflows/deploy-link-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: thesportzine-newsroom
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4

      # Same Newsroom database as the API Worker. The link Worker cannot resolve codes without it, so this step must succeed.
      - name: Attach D1 database
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > d1-list.json
          DB_JSON=$(node -e '
            const list = JSON.parse(require("fs").readFileSync("d1-list.json", "utf8"));
            const pick = list.find(d => d.name === process.env.D1_NAME) || list.find(d => /newsroom/i.test(d.name));
            process.stdout.write(pick ? JSON.stringify({ name: pick.name, id: pick.uuid || pick.id }) : "");
          ')
          [ -n "$DB_JSON" ] || { echo "Newsroom D1 database not found. Deploy the Newsroom Worker first."; exit 1; }
          DB_NAME=$(node -pe 'JSON.parse(process.argv[1]).name' "$DB_JSON")
          DB_ID=$(node -pe 'JSON.parse(process.argv[1]).id' "$DB_JSON")
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\n' "$DB_NAME" "$DB_ID" >> link-wrangler.toml
          echo "Using D1 database $DB_NAME ($DB_ID)."

      - name: Deploy Link Worker
        run: npx wrangler deploy --config link-wrangler.toml
