name: Deploy Buffer Worker

on:
  push:
    branches:
      - main
    paths:
      - "buffer-worker.js"
      - "buffer-wrangler.toml"
      - ".github/workflows/deploy-buffer-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Buffer Worker
        run: npx --yes wrangler@4 deploy --config buffer-wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
