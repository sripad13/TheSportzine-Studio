name = "thesportzine-newsroom-api"
main = "newsroom-worker.js"
compatibility_date = "2026-11-10"
workers_dev = false

[observability]
enabled = true

# The D1 binding (DB -> thesportzine-newsroom) is added automatically by
# .github/workflows/deploy-newsroom-worker.yml, which finds or creates the database.
# To pin a specific database instead, uncomment and fill in:
# [[d1_databases]]
# binding = "DB"
# database_name = "thesportzine-newsroom"
# database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[ai]
binding = "AI"
remote = true
