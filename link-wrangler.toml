name = "thesportzine-link"
main = "link-worker.js"
compatibility_date = "2026-11-10"
workers_dev = false

[observability]
enabled = true

# The D1 binding (DB) is added at deploy time by .github/workflows/deploy-link-worker.yml,
# using the same Newsroom database as the API Worker.

# Uploaded preview images live in the Studio media bucket (same one the Buffer Worker uses), under links/.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "thesportzine-studio-media"

[[routes]]
pattern = "link.falsewinger.com"
custom_domain = true
zone_name = "falsewinger.com"
