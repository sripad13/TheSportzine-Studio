.settings-panel{position:absolute;right:0;top:calc(100% + 9px);z-index:50;width:250px;padding:12px;display:grid;gap:8px;background:#151b25;border:1px solid #354154;border-radius:10px;box-shadow:0 12px 35px #0008}
.settings-panel label{font-size:10px;color:#aab3c2}.settings-panel .api{display:block;width:100%;background:#0e131b;border:1px solid #354154;color:#edf1f7;border-radius:7px;padding:9px}
.settings-panel .btn{width:100%;text-align:left;border-radius:7px}
@media(max-width:700px){
 .top{background:#10141c;padding:10px 12px 8px}
 .topright{grid-column:2;grid-row:1;gap:6px}.topright .btn{padding:8px 10px}
 .bar{height:auto;min-height:52px;padding:8px 12px;background:#0b0d12}
 .bar input{width:auto;min-width:0;flex:1}
 .board{height:auto;min-height:calc(100dvh - 135px);background:#0b0d12}
 .column{background:#141821;border-color:#293140}
 .settings-panel{right:0;width:min(270px,calc(100vw - 24px))}
}

 .priority-search{display:flex;gap:7px}.priority-search input{flex:1;min-width:0}.priority-search .btn{white-space:nowrap;padding:7px 13px}
</style></head><body>
<header class="top"><a class="brand" href="/" style="text-decoration:none;color:inherit">THE SPORTZINE <em>NEWSROOM</em></a><nav class="workspaces" id="workspaces"><button class="ws active" data-ws="All Sports">All Sports</button><button class="ws" data-ws="Football">Football</button><button class="ws" data-ws="Formula 1">Formula 1</button><button class="ws" data-ws="Breaking">Breaking</button></nav><div class="topright"><span class="status" id="status">Preview mode</span><a class="btn primary" href="/post/" style="text-decoration:none">Create Post</a><details class="settings-menu" id="settingsMenu"><summary class="btn">Settings ▾</summary><div class="settings-panel"><label for="apiBase">Newsroom API URL</label><input class="api" id="apiBase" value="https://newsroom-api.falsewinger.com" aria-label="Newsroom API URL"><button class="btn" id="connect">Connect</button><a class="btn" id="sourcesButton" href="/live/sources/">Sources</a><button class="btn" id="addColumn">＋ Column</button></div></details></div></header>
<div class="bar"><input id="globalSearch" placeholder="Search stories, clubs, drivers…"><button class="btn" id="refresh">↻ Refresh</button></div>
<main class="board" id="board" aria-label="Newsroom columns"></main>
<aside class="drawer" id="drawer"><div class="dhead"><strong></strong><button class="tiny" id="closeDrawer">✕</button></div><div class="dcontent" id="detail"><div class="empty">Select a story to inspect it.</div></div></aside>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Add column</h2><div class="field"><label>Column type</label><select id="colType"><option value="football">Football latest</option><option value="f1">Formula 1 latest</option><option value="breaking">Breaking queue</option><option value="priority">Priority stories</option><option value="search">Keyword search</option><option value="saved">Saved stories</option></select></div><div class="field"><label>Column name</label><input id="colName" placeholder="e.g. Chelsea"></div><div class="field"><label>Keyword (for search columns)</label><input id="colKeyword" placeholder="e.g. Chelsea, transfer"></div><div class="dactions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveColumn">Add column</button></div><p class="footnote">Columns are saved in this browser. Drag the board horizontally; resize columns on desktop using the lower-right edge.</p></div></div>
<script>
const API_KEY='tsz_newsroom_api';const defaultColumns=[{id:'c1',type:'football',name:'Football Latest'},{id:'c2',type:'breaking',name:'Breaking'},{id:'c3',type:'priority',name:'Priority Desk'},{id:'c4',type:'f1',name:'F1 Latest'},{id:'c5',type:'search',name:'Chelsea',keyword:'Chelsea'},{id:'c6',type:'saved',name:'Saved Stories'}];
const feeds=[
{name:'BBC Sport Football',sport:'football',url:'https://feeds.bbci.co.uk/sport/football/rss.xml',enabled:true},
{name:'Sky Sports Football',sport:'football',url:'https://www.skysports.com/rss/11095',enabled:true},
{name:'BBC Sport F1',sport:'f1',url:'https://feeds.bbci.co.uk/sport/formula1/rss.xml',enabled:true},
{name:'Sky Sports F1',sport:'f1',url:'https://www.skysports.com/rss/12433',enabled:true},
{name:'Autosport F1',sport:'f1',url:'https://www.autosport.com/rss/feed/f1',enabled:true},
{name:'Motorsport.com F1',sport:'f1',url:'https://www.motorsport.com/rss/f1/news/',enabled:true},
{name:'Formula1.com',sport:'f1',url:'https://www.formula1.com/content/fom-website/en/latest/all.xml',enabled:true}
];
let columns=JSON.parse(localStorage.getItem('tsz_columns')||'null')||defaultColumns;let stories=[];let saved=new Set(JSON.parse(localStorage.getItem('tsz_saved')||'[]'));let activeWorkspace='All Sports';let selected=null;let generatedTitles=new Map();let refreshing=false;let lastRefreshAt=0;
const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('tsz_columns',JSON.stringify(columns));}
function setStatus(t,kind=''){const el=$('#status');el.textContent=t;el.className='status '+kind}
function filtered(col){let list=col.type==='priority'?(col.searchResults||[]):[...stories];if(col.type==='football')list=list.filter(x=>x.sport==='football');if(col.type==='f1')list=list.filter(x=>x.sport==='f1');if(col.type==='breaking')list=list.filter(x=>x.breaking);if(col.type==='search')list=list.filter(x=>(x.title+' '+x.summary).toLowerCase().includes((col.keyword||col.name).toLowerCase()));if(col.type==='saved')list=list.filter(x=>saved.has(x.id));if(activeWorkspace==='Football')list=list.filter(x=>x.sport==='football');if(activeWorkspace==='Formula 1')list=list.filter(x=>x.sport==='f1');if(activeWorkspace==='Breaking')list=list.filter(x=>x.breaking);const q=$('#globalSearch').value.trim().toLowerCase();if(q)list=list.filter(x=>(x.title+' '+x.summary+' '+x.source).toLowerCase().includes(q));return list}
function storyKey(s){const link=String(s.link||s.url||'').trim();if(link){try{const u=new URL(link);return u.hostname.replace(/^www\./,'')+u.pathname.replace(/\/$/,'')}catch{}}return String(s.title||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function uniqueForColumn(col,index){const seen=new Set();columns.slice(0,index).forEach(previous=>filtered(previous).forEach(s=>seen.add(storyKey(s))));const local=new Set();return filtered(col).filter(s=>{const key=storyKey(s);if(!key||seen.has(key)||local.has(key))return false;local.add(key);return true})}
function render(){const board=$('#board');board.innerHTML='';columns.forEach((col,i)=>{const list=uniqueForColumn(col,i);const visibleCount=col.visibleCount||10;const shown=list.slice(0,visibleCount);const collapsed=!!col.collapsed;const el=document.createElement('section');el.className='column'+(collapsed?' collapsed':'');el.dataset.id=col.id;const priorityControls=col.type==='priority'?'<div class="colfilter priority-search"><input data-keyword placeholder="Enter keyword or phrase…" value="'+esc(col.keyword||'')+'"><button class="btn primary" data-search>Search</button></div>':'<div class="colfilter"><input data-filter placeholder="Filter this column…" value="'+esc(col.localFilter||'')+'"><select data-order><option value="new">Newest</option><option value="priority">Priority</option></select></div>';el.innerHTML='<div class="colhead"><button class="coltitle" type="button" data-collapse aria-expanded="'+(!collapsed)+'">'+esc(col.name)+'</button><span class="count">'+list.length+'</span><div class="coltools"><button class="tiny" data-act="left" title="Move left">‹</button><button class="tiny" data-act="right" title="Move right">›</button><button class="tiny" data-act="remove" title="Remove">×</button></div></div>'+priorityControls+'<div class="cards">'+(shown.length?shown.map(s=>storyCard(s,col)).join(''):'<div class="empty"><b>'+(col.type==='priority'?(col.searching?'Searching publications…':'Search a keyword to populate Priority Desk'):'No stories in this column yet')+'</b>'+(col.type==='priority'?(col.searching?'Checking the latest RSS articles across enabled publications.':'Enter a player, club, competition or topic above. Results are fetched live from your enabled publications.'):'Connect the feed API and refresh. This column will populate from configured RSS sources.')+'</div>')+'</div>'+(list.length>visibleCount?'<div class="load-more-wrap"><button class="btn load-more" data-load-more>Load more ('+Math.min(10,list.length-visibleCount)+' of '+(list.length-visibleCount)+')</button></div>':'');board.appendChild(el);
el.querySelector('[data-collapse]').onclick=()=>{col.collapsed=!col.collapsed;render()};
const loadMore=el.querySelector('[data-load-more]');if(loadMore)loadMore.onclick=()=>{col.visibleCount=(col.visibleCount||10)+10;render()};
if(col.type==='priority'){const input=el.querySelector('[data-keyword]');input.addEventListener('keydown',e=>{if(e.key==='Enter')searchPriority(col,input.value)});el.querySelector('[data-search]').onclick=()=>searchPriority(col,input.value)}else{el.querySelector('[data-filter]').addEventListener('input',e=>{col.localFilter=e.target.value;const q=e.target.value.toLowerCase();el.querySelectorAll('.story').forEach(card=>card.classList.toggle('hidden',!card.textContent.toLowerCase().includes(q))) });el.querySelector('[data-order]').addEventListener('change',e=>{col.order=e.target.value;render()})}
el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const n=columns.indexOf(col),a=b.dataset.act;if(a==='remove')columns=columns.filter(x=>x!==col);if(a==='left'&&n>0)[columns[n-1],columns[n]]=[columns[n],columns[n-1]];if(a==='right'&&n<columns.length-1)[columns[n+1],columns[n]]=[columns[n],columns[n+1]];persist();render()});el.querySelectorAll('.story').forEach(card=>card.onclick=()=>openStory(card.dataset.id));});}

function relativeAge(s){
 const raw=s.publishedAt||s.published||s.pubDate||s.isoDate||s.date||s.timestamp;
 if(!raw)return 'Recently';
 const date=typeof raw==='number'?(raw<1e12?new Date(raw*1000):new Date(raw)):new Date(raw);
 if(Number.isNaN(date.getTime()))return 'Recently';
 const mins=Math.max(0,Math.floor((Date.now()-date.getTime())/60000));
 if(mins<1)return 'Just now';
 if(mins<60)return mins+' min ago';
 const hrs=Math.floor(mins/60);
 if(hrs<24)return hrs+' hr ago';
 const days=Math.floor(hrs/24);
 if(days<7)return days+' day'+(days===1?'':'s')+' ago';
 const weeks=Math.floor(days/7);
 if(weeks<5)return weeks+' wk'+(weeks===1?'':'s')+' ago';
 return Math.floor(days/30)+' mo ago';
}
function plainArticleText(value){
 if(!value)return '';
 const node=document.createElement('div');node.innerHTML=String(value);
 node.querySelectorAll('script,style,iframe,form,svg').forEach(x=>x.remove());
 return (node.textContent||node.innerText||'').replace(/\s+/g,' ').trim();
}

function storyCard(s,col){const keyword=String(col?.keyword||'').trim().toLowerCase();const sport=String(s.sport||'').trim().toLowerCase();const showSport=col?.type==='priority'&&keyword&&keyword===sport;const showPriority=col?.type==='priority'&&keyword==='priority'&&s.priority;return '<article class="story '+(selected===s.id?'selected':'')+'" data-id="'+esc(s.id)+'"><div class="meta"><span class="source">'+esc(s.source)+'</span><span>·</span><span>'+esc(relativeAge(s))+'</span>'+(s.breaking?'<span class="pill breaking">BREAKING</span>':'')+'</div><h3>'+esc(s.title)+'</h3><div class="storyfoot">'+(showPriority?'<span class="pill priority">PRIORITY</span>':'')+(showSport?'<span class="pill">'+esc(s.sport.toUpperCase()==='F1'?'FORMULA 1':s.sport.toUpperCase())+'</span>':'')+(s.duplicateCount>1?'<span class="pill duplicate">'+s.duplicateCount+' SOURCES</span>':'')+'</div></article>'}

async function createPostFromStory(id){
 const s=stories.find(x=>x.id===id);if(!s)return;
 const button=$('#createPostFromStory');if(button){button.disabled=true;button.textContent='Preparing…'}
 const error=$('#createPostError');if(error)error.textContent='';
 try{
  let item=generatedTitles.get(id);
  if(!item){
   const base=$('#apiBase').value.trim().replace(/\/$/,'');
   const response=await fetch(base+'/api/short-title',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:s.title,summary:s.summary||''})});
   const data=await response.json();if(!response.ok)throw new Error(data.error||'Title generation failed.');
   const title=String(data.title||'').trim(),words=title.split(/\s+/).filter(Boolean);
   if(!title||words.length>9)throw new Error('The generated title did not meet the nine-word limit.');
   item={title,words:words.length};generatedTitles.set(id,item);
  }
  const caption=plainArticleText(s.summary||s.description||s.contentSnippet||'').slice(0,280);
  const params=new URLSearchParams({headline:item.title,subtitle:'Source: '+s.source,caption});
  window.location.href='/post/?'+params.toString();
 }catch(e){
  if(error)error.textContent=e.message||'Could not prepare the post.';
  if(button){button.disabled=false;button.textContent='Create Post'}
 }
}

function openStory(id){
 selected=id;const s=stories.find(x=>x.id===id);if(!s)return;
 const body=plainArticleText(s.content||s.contentEncoded||s.summary||s.description||s.contentSnippet||'');
 const label=(s.content||s.contentEncoded)?'Article text':(body?'Summary':'No article text available in this feed');
 $('#detail').innerHTML='<div class="meta">'+esc(s.source)+' · '+esc(s.sport==='f1'?'FORMULA 1':'FOOTBALL')+' · '+esc(relativeAge(s))+'</div><h2>'+esc(s.title)+'</h2><div class="dactions"><a class="btn primary" href="'+esc(s.link||'#')+'" target="_blank" rel="noopener">Open original</a><button class="btn" id="saveStory">'+(saved.has(s.id)?'Unsave':'Save story')+'</button><button class="btn" id="createPostFromStory">Create Post</button></div><div class="article-body">'+(body?esc(body):'<p>The RSS feed provides a headline only. Open the original publication to read the full article.</p>')+'</div><div class="short-title-error" id="createPostError"></div>';
 $('#drawer').classList.add('open');
 $('#saveStory').onclick=()=>{saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('tsz_saved',JSON.stringify([...saved]));render();openStory(id)};
  const createPostButton=$('#createPostFromStory');if(createPostButton)createPostButton.onclick=()=>createPostFromStory(id);
 render();
}

async function searchPriority(col,rawKeyword){const keyword=String(rawKeyword||'').trim();if(!keyword){col.searchResults=[];col.keyword='';persist();render();return}col.keyword=keyword;col.searching=true;persist();render();const base=$('#apiBase').value.trim().replace(/\/$/,'');try{const response=await fetch(base+'/api/search?keyword='+encodeURIComponent(keyword));const data=await response.json();if(!response.ok)throw new Error(data.error||'Search failed (HTTP '+response.status+').');col.searchResults=(data.stories||[]).map((s,i)=>({...s,id:s.id||s.link||String(i)}));col.searchMeta={searchedAt:data.fetched_at,feeds:data.feeds||[]};col.searching=false;render();}catch(error){col.searching=false;col.searchResults=[];render();const cards=document.querySelector('[data-id="'+CSS.escape(col.id)+'"] .cards');if(cards)cards.innerHTML='<div class="empty"><b>Keyword search failed</b>'+esc(error.message)+'</div>';}}

async function refresh(){
 if(refreshing)return;
 const base=$('#apiBase').value.trim().replace(/\/$/,'');if(!base){setStatus('API not configured');return}
 refreshing=true;localStorage.setItem(API_KEY,base);setStatus('Fetching feeds…');
 try{
  const r=await fetch(base+'/api/feed');if(!r.ok)throw new Error('API returned '+r.status);
  const data=await r.json();stories=(data.stories||[]).map((x,i)=>({...x,id:x.id||x.link||String(i),sport:x.sport||'football',timeLabel:x.timeLabel||'RSS'}));
  lastRefreshAt=Date.now();const failed=(data.feeds||[]).filter(x=>x.error);
  setStatus(stories.length+' stories · '+failed.length+' feed errors',failed.length?'bad':'ok');
  $('#status').title=(data.feeds||[]).map(x=>x.name+': '+(x.error||x.count+' items')).join(' | ');render();
 }catch(e){setStatus('Feed connection failed','bad');console.error(e)}
 finally{refreshing=false}
}
$('#apiBase').value=localStorage.getItem(API_KEY)||'https://newsroom-api.falsewinger.com';
$('#connect').onclick=refresh;$('#refresh').onclick=refresh;$('#globalSearch').oninput=render;$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');
$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer'))$('#drawer').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').classList.remove('open')});
$('#workspaces').onclick=e=>{const b=e.target.closest('[data-ws]');if(!b)return;activeWorkspace=b.dataset.ws;document.querySelectorAll('.ws').forEach(x=>x.classList.toggle('active',x===b));const workspaceLabel=$('#workspaceLabel');if(workspaceLabel)workspaceLabel.textContent=activeWorkspace;render()};
$('#addColumn').onclick=()=>$('#modal').classList.add('open');$('#cancelModal').onclick=()=>$('#modal').classList.remove('open');$('#saveColumn').onclick=()=>{const type=$('#colType').value,name=$('#colName').value.trim()||({football:'Football Latest',f1:'F1 Latest',breaking:'Breaking',priority:'Priority Desk',search:'Keyword Search',saved:'Saved Stories'}[type]);columns.push({id:crypto.randomUUID(),type,name,keyword:$('#colKeyword').value.trim()});persist();$('#modal').classList.remove('open');$('#colName').value='';$('#colKeyword').value='';render()};



render();refresh();
// Refresh feeds every 30 minutes while this Newsroom tab remains open.
setInterval(()=>{if(!document.hidden)refresh()},30*60*1000);
// Refresh immediately on return if the tab was hidden beyond the 30-minute window.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRefreshAt>=30*60*1000)refresh()});
</script></body></html>
