<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c10"><title>Newsroom — TheSportzine Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=League+Gothic&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0c10;--panel:#15171d;--panel2:#1b1e26;--line:#2b2e38;--muted:#9297a5;--text:#f3f4f7;--yellow:#ffeb00;--green:#80d99b;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,Arial,sans-serif;overflow:hidden;min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.top{height:58px;display:flex;align-items:center;gap:18px;padding:0 17px;border-bottom:1px solid var(--line);background:#101116}.brand{font-weight:850;font-size:17px;letter-spacing:-.6px;white-space:nowrap}.brand em{font-style:normal;color:var(--yellow)}.workspaces{display:flex;gap:5px;overflow:auto}.ws{border:0;background:transparent;color:#aeb2bd;padding:9px 12px;border-radius:7px;white-space:nowrap}.ws.active{background:#292c35;color:#fff}.topright{margin-left:auto;display:flex;gap:7px;align-items:center}.btn{border:1px solid #3a3d48;background:#20232c;border-radius:7px;padding:8px 11px;font-size:12px}.btn:hover{border-color:#777}.btn.primary{background:var(--yellow);color:#101010;border-color:var(--yellow);font-weight:800}.api{width:205px;background:#0b0c10;border:1px solid var(--line);color:#d9dbe1;border-radius:6px;padding:8px;font-size:11px}.status{font-size:10px;color:var(--muted);white-space:nowrap}.status:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#777;margin:0 6px 1px 0}.status.ok:before{background:var(--green)}.status.bad:before{background:var(--red)}.bar{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 16px;background:#0e0f14}.bar .hint{color:var(--muted);font-size:11px}.bar input{background:#181a21;border:1px solid var(--line);border-radius:6px;color:#fff;padding:7px 10px;width:220px}.bar .spacer{flex:1}.board{height:calc(100dvh - 100px);display:flex;gap:12px;padding:12px;overflow-x:auto;overflow-y:hidden;align-items:stretch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.column{width:350px;min-width:300px;max-width:520px;flex:0 0 350px;scroll-snap-align:start;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;resize:horizontal}.colhead{height:49px;flex:0 0 49px;padding:0 11px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:#191b22}.coltitle{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.count{font-size:10px;color:var(--muted);background:#292c35;padding:3px 6px;border-radius:10px}.coltools{display:flex;gap:3px}.tiny{border:0;background:transparent;color:#a6aab5;padding:5px 6px;border-radius:4px}.tiny:hover{background:#30333d;color:white}.colfilter{padding:7px 9px;border-bottom:1px solid var(--line);display:flex;gap:5px}.colfilter input,.colfilter select{min-width:0;width:100%;background:#101116;border:1px solid #30333d;color:#cfd2da;border-radius:5px;padding:6px;font-size:10px}.cards{overflow-y:auto;flex:1;overscroll-behavior:contain}.story{padding:15px 14px 13px;border-bottom:1px solid #282b34;cursor:pointer;transition:background .12s}.story:hover{background:#1d2028}.story.selected{background:#252832;box-shadow:inset 3px 0 var(--yellow)}.meta{display:flex;align-items:center;gap:6px;color:#9297a5;font-size:9px;text-transform:uppercase;letter-spacing:.5px}.source{color:#d1d3da;font-weight:700}.priority{color:var(--yellow);font-weight:800}.story h3{font-size:13px;line-height:1.5;margin:7px 0 6px;font-weight:650}.excerpt{font-size:11px;color:#a7abb6;line-height:1.5;margin:0}.storyfoot{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.pill{border:1px solid #383c47;color:#aeb2bc;border-radius:4px;padding:3px 5px;font-size:9px}.pill.breaking{color:#ff9b9b;border-color:#704242}.pill.duplicate{color:#9fc4ff;border-color:#3c5578}.empty{padding:28px 15px;color:#9297a5;text-align:center;font-size:11px;line-height:1.6}.empty b{display:block;color:#e8e9ee;margin-bottom:5px}.drawer{position:fixed;right:0;top:58px;bottom:0;width:min(420px,94vw);background:#15171e;border-left:1px solid #393c46;z-index:5;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-20px 0 60px #0008}.drawer.open{transform:translateX(0)}.dhead{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center}.dhead strong{flex:1}.dcontent{padding:18px;overflow:auto}.dcontent h2{font-size:19px;line-height:1.4;margin:12px 0}.dcontent p{font-size:12px;color:#b2b6c1;line-height:1.7}.dcontent .sourcebox{background:#20232b;border:1px solid #353945;border-radius:7px;padding:10px;margin:12px 0;font-size:11px}.dactions{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:15px}.modal.open{display:flex}.dialog{background:#191c24;border:1px solid #40434e;border-radius:10px;padding:18px;width:min(420px,100%)}.dialog h2{font-size:16px;margin:0 0 15px}.field{margin:11px 0}.field label{display:block;color:#aeb2bd;font-size:10px;margin-bottom:5px}.field input,.field select{width:100%;background:#0e1015;border:1px solid #383c47;border-radius:6px;color:white;padding:9px}.footnote{color:#8e93a0;font-size:10px;line-height:1.6;margin-top:12px}.hidden{display:none!important}.mobilehint{display:none}
@media(max-width:700px){body{overflow:hidden}.top{height:auto;min-height:unset;padding:10px 12px 8px;display:grid;grid-template-columns:1fr auto;gap:9px}.brand{font-size:15px;grid-column:1}.workspaces{grid-column:1/-1;grid-row:2;width:100%;padding:2px 0 3px;gap:4px;overflow-x:auto;scrollbar-width:none}.workspaces::-webkit-scrollbar{display:none}.ws{padding:8px 11px;font-size:11px;flex:0 0 auto}.topright{grid-column:2;grid-row:1;margin:0;gap:5px}.api{display:none}.status{font-size:9px;max-width:90px;overflow:hidden;text-overflow:ellipsis}.topright .btn{padding:8px 9px;font-size:10px;white-space:nowrap}#addColumn{display:none}.bar{height:auto;min-height:48px;padding:8px 10px;gap:7px;display:flex;flex-wrap:wrap}.bar .hint{display:none}#workspaceLabel{font-size:11px}.bar .spacer{display:none}.bar input{width:auto;min-width:0;flex:1;padding:9px 10px;font-size:12px}#refresh{padding:9px 11px}.board{height:calc(100dvh - 140px);padding:9px;gap:9px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;align-items:stretch}.column{width:88vw;min-width:88vw;max-width:88vw;flex-basis:88vw;resize:none;scroll-snap-align:center}.colhead{height:48px;flex-basis:48px}.coltitle{font-size:13px}.colfilter{padding:8px;gap:7px}.colfilter input,.colfilter select{font-size:11px;padding:8px}.cards{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.story{padding:15px 13px}.story h3{font-size:14px;line-height:1.45}.excerpt{font-size:11px;line-height:1.55}.meta{font-size:9px;flex-wrap:wrap}.drawer{top:0;bottom:0;width:100%;max-width:none;border-left:0;z-index:20}.dhead{padding:16px}.dcontent{padding:18px 16px}.dcontent h2{font-size:20px}.dcontent p{font-size:13px}.dactions .btn{padding:10px 12px}.modal{align-items:flex-end;padding:0}.dialog{width:100%;border-radius:16px 16px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom))}}@media(min-width:701px) and (max-width:1050px){.top{gap:9px;padding:0 11px}.brand{font-size:14px}.api{width:155px}.column{width:320px;min-width:290px;flex-basis:320px}.board{height:calc(100dvh - 100px)}}
</style></head><body>
<header class="top"><a class="brand" href="/" style="text-decoration:none;color:inherit">THE SPORTZINE <em>NEWSROOM</em></a><nav class="workspaces" id="workspaces"><button class="ws active" data-ws="All Sports">All Sports</button><button class="ws" data-ws="Football">Football</button><button class="ws" data-ws="Formula 1">Formula 1</button><button class="ws" data-ws="Breaking">Breaking</button></nav><div class="topright"><span class="status" id="status">Preview mode</span><input class="api" id="apiBase" value="https://newsroom-api.falsewinger.com" aria-label="Newsroom API URL"><button class="btn" id="connect">Connect</button><button class="btn" id="addColumn">＋ Column</button><a class="btn" href="/post/" style="text-decoration:none">Graphics ↗</a></div></header>
<div class="bar"><span class="hint">WORKSPACE</span><strong id="workspaceLabel">All Sports</strong><span class="hint">·</span><span class="hint">Independent feeds · scroll each column</span><span class="spacer"></span><input id="globalSearch" placeholder="Search stories, clubs, drivers…"><button class="btn" id="refresh">↻ Refresh</button></div>
<main class="board" id="board" aria-label="Newsroom columns"></main>
<aside class="drawer" id="drawer"><div class="dhead"><strong>STORY WORKSPACE</strong><button class="tiny" id="closeDrawer">✕</button></div><div class="dcontent" id="detail"><div class="empty">Select a story to inspect it.</div></div></aside>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Add column</h2><div class="field"><label>Column type</label><select id="colType"><option value="football">Football latest</option><option value="f1">Formula 1 latest</option><option value="breaking">Breaking queue</option><option value="priority">Priority stories</option><option value="search">Keyword search</option><option value="saved">Saved stories</option></select></div><div class="field"><label>Column name</label><input id="colName" placeholder="e.g. Chelsea"></div><div class="field"><label>Keyword (for search columns)</label><input id="colKeyword" placeholder="e.g. Chelsea, transfer"></div><div class="dactions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveColumn">Add column</button></div><p class="footnote">Columns are saved in this browser. Drag the board horizontally; resize columns on desktop using the lower-right edge.</p></div></div>
<script>
const API_KEY='tsz_newsroom_api';const defaultColumns=[{id:'c1',type:'football',name:'Football Latest'},{id:'c2',type:'breaking',name:'Breaking'},{id:'c3',type:'priority',name:'Priority Desk'},{id:'c4',type:'f1',name:'F1 Latest'},{id:'c5',type:'search',name:'Chelsea',keyword:'Chelsea'},{id:'c6',type:'saved',name:'Saved Stories'}];
const feeds=[
{name:'BBC Sport Football',sport:'football',url:'https://feeds.bbci.co.uk/sport/football/rss.xml',enabled:true},
{name:'Sky Sports Football',sport:'football',url:'https://www.skysports.com/rss/11095',enabled:true},
{name:'BBC Sport F1',sport:'f1',url:'https://feeds.bbci.co.uk/sport/formula1/rss.xml',enabled:true},
{name:'Sky Sports F1',sport:'f1',url:'https://www.skysports.com/rss/12433',enabled:true},
{name:'Autosport F1',sport:'f1',url:'https://www.autosport.com/rss/feed/f1',enabled:true},
{name:'Motorsport.com F1',sport:'f1',url:'https://www.motorsport.com/rss/f1/news/',enabled:true},
{name:'Formula1.com',sport:'f1',url:'https://www.formula1.com/content/fom-website/en/latest/all.xml',enabled:true}
];
let columns=JSON.parse(localStorage.getItem('tsz_columns')||'null')||defaultColumns;let stories=[];let saved=new Set(JSON.parse(localStorage.getItem('tsz_saved')||'[]'));let activeWorkspace='All Sports';let selected=null;
const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('tsz_columns',JSON.stringify(columns));}
function setStatus(t,kind=''){const el=$('#status');el.textContent=t;el.className='status '+kind}
function filtered(col){let list=[...stories];if(col.type==='football')list=list.filter(x=>x.sport==='football');if(col.type==='f1')list=list.filter(x=>x.sport==='f1');if(col.type==='breaking')list=list.filter(x=>x.breaking);if(col.type==='priority')list=list.filter(x=>x.priority);if(col.type==='search')list=list.filter(x=>(x.title+' '+x.summary).toLowerCase().includes((col.keyword||col.name).toLowerCase()));if(col.type==='saved')list=list.filter(x=>saved.has(x.id));if(activeWorkspace==='Football')list=list.filter(x=>x.sport==='football');if(activeWorkspace==='Formula 1')list=list.filter(x=>x.sport==='f1');if(activeWorkspace==='Breaking')list=list.filter(x=>x.breaking);const q=$('#globalSearch').value.trim().toLowerCase();if(q)list=list.filter(x=>(x.title+' '+x.summary+' '+x.source).toLowerCase().includes(q));return list}
function render(){const board=$('#board');board.innerHTML='';columns.forEach((col,i)=>{const list=filtered(col);const el=document.createElement('section');el.className='column';el.dataset.id=col.id;el.innerHTML='<div class="colhead"><span class="coltitle">'+esc(col.name)+'</span><span class="count">'+list.length+'</span><div class="coltools"><button class="tiny" data-act="left" title="Move left">‹</button><button class="tiny" data-act="right" title="Move right">›</button><button class="tiny" data-act="remove" title="Remove">×</button></div></div><div class="colfilter"><input data-filter placeholder="Filter this column…" value="'+esc(col.localFilter||'')+'"><select data-order><option value="new">Newest</option><option value="priority">Priority</option></select></div><div class="cards">'+(list.length?list.map(storyCard).join(''):'<div class="empty"><b>No stories in this column yet</b>Connect the feed API and refresh. This column will populate from configured RSS sources.</div>')+'</div>';board.appendChild(el);el.querySelector('[data-filter]').addEventListener('input',e=>{col.localFilter=e.target.value;const q=e.target.value.toLowerCase();el.querySelectorAll('.story').forEach(card=>card.classList.toggle('hidden',!card.textContent.toLowerCase().includes(q)))});el.querySelector('[data-order]').addEventListener('change',e=>{col.order=e.target.value;render()});el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const n=columns.indexOf(col),a=b.dataset.act;if(a==='remove')columns=columns.filter(x=>x!==col);if(a==='left'&&n>0)[columns[n-1],columns[n]]=[columns[n],columns[n-1]];if(a==='right'&&n<columns.length-1)[columns[n+1],columns[n]]=[columns[n],columns[n+1]];persist();render()});el.querySelectorAll('.story').forEach(card=>card.onclick=()=>openStory(card.dataset.id));});}
function storyCard(s){return '<article class="story '+(selected===s.id?'selected':'')+'" data-id="'+esc(s.id)+'"><div class="meta"><span class="source">'+esc(s.source)+'</span><span>·</span><span>'+esc(s.timeLabel||'Recent')+'</span>'+(s.priority?'<span class="priority">★ PRIORITY</span>':'')+'</div><h3>'+esc(s.title)+'</h3><div class="storyfoot">'+(s.breaking?'<span class="pill breaking">BREAKING</span>':'')+'<span class="pill">'+(s.sport==='f1'?'FORMULA 1':'FOOTBALL')+'</span>'+(s.duplicateCount>1?'<span class="pill duplicate">'+s.duplicateCount+' SOURCES</span>':'')+'</div></article>'}
function openStory(id){selected=id;const s=stories.find(x=>x.id===id);if(!s)return;$('#detail').innerHTML='<div class="meta">'+esc(s.source)+' · '+esc(s.sport==='f1'?'FORMULA 1':'FOOTBALL')+'</div><h2>'+esc(s.title)+'</h2><div class="sourcebox"><b>Source</b><br>'+esc(s.source)+'<br><span style="color:#9da2af">'+esc(s.published||'Publication time unavailable')+'</span></div><div class="dactions"><a class="btn primary" href="'+esc(s.link)+'" target="_blank" rel="noopener">Open original ↗</a><button class="btn" id="saveStory">'+(saved.has(s.id)?'Unsave':'Save story')+'</button><button class="btn" id="copyTitle">Copy headline</button></div><p class="footnote">Editorial aid only. Verify the original report and details before publication. Read the original report before publication.</p>';$('#drawer').classList.add('open');$('#saveStory').onclick=()=>{saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('tsz_saved',JSON.stringify([...saved]));render();openStory(id)};$('#copyTitle').onclick=()=>navigator.clipboard?.writeText(s.title);render()}
async function refresh(){const base=$('#apiBase').value.trim().replace(/\/$/,'');if(!base){setStatus('API not configured');return}localStorage.setItem(API_KEY,base);setStatus('Fetching feeds…');try{const r=await fetch(base+'/api/feed');if(!r.ok)throw new Error('API returned '+r.status);const data=await r.json();stories=(data.stories||[]).map((x,i)=>({...x,id:x.id||x.link||String(i),sport:x.sport||'football',timeLabel:x.timeLabel||'RSS'}));const failed=(data.feeds||[]).filter(x=>x.error);setStatus(stories.length+' stories · '+failed.length+' feed errors',failed.length?'bad':'ok');$('#status').title=(data.feeds||[]).map(x=>x.name+': '+(x.error||x.count+' items')).join(' | ');render()}catch(e){setStatus('Feed connection failed','bad');console.error(e)}}
$('#apiBase').value=localStorage.getItem(API_KEY)||'https://newsroom-api.falsewinger.com';
$('#connect').onclick=refresh;$('#refresh').onclick=refresh;$('#globalSearch').oninput=render;$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');
$('#workspaces').onclick=e=>{const b=e.target.closest('[data-ws]');if(!b)return;activeWorkspace=b.dataset.ws;document.querySelectorAll('.ws').forEach(x=>x.classList.toggle('active',x===b));$('#workspaceLabel').textContent=activeWorkspace;render()};
$('#addColumn').onclick=()=>$('#modal').classList.add('open');$('#cancelModal').onclick=()=>$('#modal').classList.remove('open');$('#saveColumn').onclick=()=>{const type=$('#colType').value,name=$('#colName').value.trim()||({football:'Football Latest',f1:'F1 Latest',breaking:'Breaking',priority:'Priority Desk',search:'Keyword Search',saved:'Saved Stories'}[type]);columns.push({id:crypto.randomUUID(),type,name,keyword:$('#colKeyword').value.trim()});persist();$('#modal').classList.remove('open');$('#colName').value='';$('#colKeyword').value='';render()};
render();refresh();
</script></body></html>
