<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>Sources — TheSportzine Newsroom</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;background:#0b0d12;color:#edf1f7;font:14px Inter,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#edf1f7}.wrap{max-width:1120px;margin:auto;padding:28px 22px 60px}.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}.brand{font-size:19px;font-weight:850;letter-spacing:-.5px}.brand em{font-style:normal;color:#f4c542}.top a{color:#dce3ed;text-decoration:none;border:1px solid #354154;border-radius:20px;padding:9px 14px;font-size:12px}.top .spacer{flex:1}h1{font-size:30px;margin:0 0 7px;letter-spacing:-1px}.sub{color:#aab3c2;font-size:13px;margin-bottom:24px}.panel{background:#141821;border:1px solid #293140;border-radius:13px;padding:18px;margin:18px 0}.panel h2{font-size:16px;margin:0 0 14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select{background:#0e131b;border:1px solid #354154;color:#edf1f7;border-radius:8px;padding:10px 12px;min-width:0}.toolbar input{flex:1;min-width:200px}.toolbar select{min-width:160px}.source-list{display:grid;gap:9px}.source{display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1.4fr) 140px auto auto;gap:9px;align-items:center;padding:11px;background:#1a202b;border:1px solid #303a4a;border-radius:10px}.source input{width:100%;font-size:12px;background:#0e131b;border:1px solid #354154;color:#edf1f7;border-radius:8px;padding:10px 12px}.tag{font-size:11px;color:#b8c3d3;background:#273142;border:1px solid #354154;border-radius:20px;padding:7px 10px;text-align:center}.btn{border:1px solid #354154;background:#1a202b;color:#e2e8f0;border-radius:20px;padding:9px 14px;font-weight:600;font-size:12px;cursor:pointer}.btn.primary{background:#f4c542;border-color:#f4c542;color:#111827}.btn.danger{color:#ff9b9b;border-color:#71343d;background:#351d23}.formgrid{display:grid;grid-template-columns:1fr 1.5fr 180px auto;gap:10px;align-items:end}.source-form{display:grid;grid-template-columns:1fr 1.5fr 180px auto;gap:10px;align-items:end}.url-control{display:flex;gap:8px}.url-control input{flex:1;min-width:0}.url-control .btn{white-space:nowrap}.source-form>#add{white-space:nowrap;height:38px}.field label{display:block;color:#aab3c2;font-size:11px;margin:0 0 6px}.field input,.field select{width:100%}.message{font-size:12px;color:#aab3c2;margin:10px 0}.message.error{color:#ff9b9b}.message.ok{color:#65cf91}.empty{padding:28px;text-align:center;color:#929bad;border:1px dashed #354154;border-radius:10px}.hint{font-size:11px;color:#929bad;margin-top:12px;line-height:1.6}.inline{display:flex;gap:9px;align-items:end}.inline .field{flex:1}.inline select{min-width:150px}@media(max-width:760px){.wrap{padding:18px 12px 40px}.top{flex-wrap:wrap}.brand{font-size:16px}h1{font-size:25px}.source{grid-template-columns:1fr;gap:7px}.tag{text-align:left;width:max-content}.formgrid,.source-form,.inline.url-control{flex-direction:row}.source-form>#add{width:100%}.panel{padding:14px}.toolbar select{flex:1}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand">TheSportzine <em>NEWSROOM</em></div><span class="spacer"></span><a href="/live/">← Back to Newsroom</a></header>
<h1>Sources</h1><div class="sub">Manage RSS publications tracked by Newsroom Live.</div>
<section class="panel"><h2>All sources <span id="total" style="color:#929bad;font-weight:500"></span></h2><div class="toolbar"><input id="search" placeholder="Search source name or URL…"><select id="filter"><option value="">All added sports</option></select><button class="btn" id="reload">Refresh</button></div><div id="list" class="source-list"><div class="empty">Loading sources…</div></div><div id="message" class="message"></div></section>
<section class="panel"><h2>Add a source</h2><div class="source-form"><div class="field"><label for="name">Source Name</label><input id="name" placeholder="e.g. The Athletic"></div><div class="field"><label for="url">Website or RSS URL</label><div class="url-control"><input id="url" type="url" placeholder="https://example.com or RSS feed URL"><button class="btn" id="discover" type="button">Find RSS</button></div></div><div class="field"><label for="sport">Sport tag</label><select id="sport"></select></div><button class="btn primary" id="add">Add source</button></div><div id="discovery" class="message"></div><div class="hint">Enter a homepage or RSS URL. Find RSS detects the feed and replaces the website URL with the feed URL.</div></section>

</main><script>
const API_KEY='tsz_newsroom_api';const apiBase=(localStorage.getItem(API_KEY)||'https://newsroom-api.falsewinger.com').replace(/\/$/,'');const api=apiBase+'/api/sources';let sources=[],sports=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(id,t,kind=''){const el=$(id);el.textContent=t;el.className='message '+kind}
function normalizeSport(s){const v=String(s||'General sports').trim();return v.toLowerCase()==='f1'?'Formula 1':v.toLowerCase()==='football'?'Football':v.toLowerCase()==='general'?'General sports':v}
function sportOptions(){const names=[...new Set(sports)].sort((a,b)=>a.localeCompare(b));const options=names.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('')+'<option value="__new">Add new sport</option>';['sport'].forEach(id=>{const el=$(id),current=el.value;el.innerHTML=options;if(names.includes(current))el.value=current;});$('filter').innerHTML='<option value="">All added sports</option>'+names.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('')}
function handleSportChange(id){const el=$(id);if(el.value!=='__new')return;const name=prompt('Enter the new sport name:');if(!name||!name.trim()){el.value=sports[0]||'';return}const clean=name.trim();if(!sports.some(s=>s.toLowerCase()===clean.toLowerCase()))sports.push(clean);sportOptions();el.value=clean}
function render(){const q=$('search').value.trim().toLowerCase(),sport=$('filter').value;const shown=sources.filter(s=>(!sport||normalizeSport(s.sport)===sport)&&(!q||(s.name+' '+s.feed_url).toLowerCase().includes(q)));$('total').textContent='('+shown.length+' of '+sources.length+')';$('list').innerHTML=shown.length?shown.map(s=>'<div class="source"><input aria-label="Source name" data-name="'+esc(s.id)+'" value="'+esc(s.name)+'" readonly><input aria-label="Feed URL" data-url="'+esc(s.id)+'" value="'+esc(s.feed_url)+'" readonly><select aria-label="Sport tag" data-sport="'+esc(s.id)+'" disabled>'+[...new Set([...sports,normalizeSport(s.sport)])].map(x=>'<option value="'+esc(x)+'" '+(normalizeSport(s.sport)===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select><button class="btn" data-edit="'+esc(s.id)+'">Edit</button><button class="btn danger" data-delete="'+esc(s.id)+'">Delete</button></div>').join(''):'<div class="empty">No sources match this filter.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSource(b.dataset.edit,b));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeSource(b.dataset.delete))}
async function editSource(id,button){const row=button.closest('.source'),name=row.querySelector('[data-name]'),url=row.querySelector('[data-url]'),sport=row.querySelector('[data-sport]');if(button.dataset.mode!=='save'){name.readOnly=false;url.readOnly=false;sport.disabled=false;button.textContent='Save';button.dataset.mode='save';return}button.disabled=true;try{const r=await fetch(api+'/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value.trim(),feed_url:url.value.trim(),sport:sport.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not update source.');await load();message('message','Source updated successfully.','ok')}catch(e){message('message',e.message,'error');button.disabled=false}}
async function load(){message('message','Loading all configured sources…');$('list').innerHTML='<div class="empty">Loading sources…</div>';try{const r=await fetch(api);const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load sources (HTTP '+r.status+').');sources=d.sources||[];sports=[...new Set([...sports,...sources.map(s=>normalizeSport(s.sport))])];sportOptions();render();message('message',sources.length+' sources loaded.','ok')}catch(e){$('list').innerHTML='<div class="empty">Could not load sources.</div>';message('message',e.message,'error')}}
async function removeSource(id){const s=sources.find(x=>String(x.id)===id);if(!s||!confirm('Delete '+s.name+' from Newsroom?'))return;try{const r=await fetch(api+'/'+encodeURIComponent(id),{method:'DELETE'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Delete failed.');sources=sources.filter(x=>String(x.id)!==id);sports=[...new Set(sources.map(s=>normalizeSport(s.sport)))];sportOptions();render();message('message',s.name+' deleted.','ok')}catch(e){message('message',e.message,'error')}}
$('sport').onchange=()=>handleSportChange('sport');
$('discover').onclick=async()=>{const url=$('url').value.trim();if(!url){message('discovery','Enter a website URL first.','error');return}message('discovery','Searching for RSS / Atom feeds…');try{const r=await fetch(apiBase+'/api/discover-feed',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Discovery failed.');if(!d.feeds?.length)throw new Error('No feed found automatically. Enter a feed URL manually.');$('url').value=d.feeds[0].url;if(!$('name').value)$('name').value=d.feeds[0].title||new URL(url).hostname;message('discovery','Found feed: '+d.feeds[0].url,'ok')}catch(e){message('discovery',e.message,'error')}};
$('add').onclick=async()=>{const name=$('name').value.trim(),feed_url=$('url').value.trim(),sport=$('sport').value;if(!name||!feed_url||!sport||sport==='__new'){message('message','Enter a source name, feed URL and sport.','error');return}try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,feed_url,sport,enabled:true})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not add source.');$('name').value='';$('url').value='';await load();message('message',name+' added successfully.','ok')}catch(e){message('message',e.message,'error')}};
$('reload').onclick=load;$('search').oninput=render;$('filter').onchange=render;load();
</script></body></html>
