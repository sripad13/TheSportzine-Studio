<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Newsroom demo — Studio</title>
<link rel="icon" href="/brand/studio-mark-light.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/studio/studio.css?v=20261115-demo">
<script defer src="/assets/studio/studio.js?v=20261114-14"></script>
<style>
:root{color-scheme:light dark}
body{margin:0;font:14px/1.45 Inter,system-ui,Arial,sans-serif;background:#F5F6F2;color:#0B0B0D}
@media (prefers-color-scheme:dark){body{background:#0B0B0D;color:#F5F6F2}}
.demo-banner{background:#B7D957;color:#0B0B0D;padding:10px 16px;font-weight:600;text-align:center}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:18px;max-width:1200px;margin:0 auto}
.column{background:#FFFFFF;border:1px solid #dcdfd6;border-radius:10px;overflow:hidden}
@media (prefers-color-scheme:dark){.column{background:#171916;border-color:#2c2f27}}
.column h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid #dcdfd6;display:flex;justify-content:space-between}
.story{padding:12px 14px;border-bottom:1px solid #eceee6}
.story:last-child{border-bottom:0}
.meta{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6b6f63;display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid #B7D957;border-radius:20px;padding:0 6px;color:#3d4a17}
.story h3{font-size:15px;margin:6px 0 4px}
.story p{margin:0;color:#4d5147;font-size:13px}
.note{max-width:1200px;margin:0 auto;padding:0 18px 30px;font-size:12px;color:#6b6f63}
a{color:inherit}
</style>
</head>
<body>
<header class="studio-global-header"><a class="studio-global-brand" href="/" aria-label="Studio home"><img class="studio-brand-mark" alt="" src="/brand/studio-mark-light.svg"><span class="studio-brand-word">Studio</span></a><nav class="studio-global-nav" aria-label="Primary navigation"><a href="/live/">Newsroom</a><a href="/post/">Create</a><a href="/seo/">Optimize</a><a href="/ai-audit/">Audit</a></nav><div class="studio-global-actions"></div></header>
<div class="demo-banner">Demo with sample stories. These are not live headlines, and no feeds, AI tools or Buffer accounts are connected.</div>
<main id="board" aria-label="Demo Newsroom columns"></main>
<p class="note">This page shows how the Newsroom is laid out. Headlines are invented for the demo and do not come from any publisher. The live Newsroom is private.</p>
<script>
// Fixed sample data only: no network requests, no API keys, no user data.
const SAMPLE = [
  {column:'Football latest', sport:'Football', source:'Sample Sports Daily', age:'12 min ago', title:'Striker completes move to rebuilding club', summary:'Sample headline for the demo layout.', breaking:true},
  {column:'Football latest', sport:'Football', source:'Sample Sports Daily', age:'40 min ago', title:'Manager praises young squad after late win', summary:'Sample headline for the demo layout.'},
  {column:'Football latest', sport:'Football', source:'Sample Football Wire', age:'2 hr ago', title:'Injury update ahead of cup weekend', summary:'Sample headline for the demo layout.'},
  {column:'Formula 1 latest', sport:'Formula 1', source:'Sample Motorsport', age:'25 min ago', title:'Team confirms upgrade package for next race', summary:'Sample headline for the demo layout.', breaking:true},
  {column:'Formula 1 latest', sport:'Formula 1', source:'Sample Motorsport', age:'3 hr ago', title:'Qualifying order shaped by changing weather', summary:'Sample headline for the demo layout.'},
  {column:'Breaking', sport:'Football', source:'Sample Sports Daily', age:'5 min ago', title:'Club confirms surprise coaching change', summary:'Sample headline for the demo layout.', breaking:true}
];
const board = document.getElementById('board');
const columns = [...new Set(SAMPLE.map(s => s.column))];
board.innerHTML = columns.map(name => {
  const stories = SAMPLE.filter(s => s.column === name);
  return '<section class="column"><h2><span>' + name + '</span><span>' + stories.length + '</span></h2>' +
    stories.map(s => '<article class="story"><div class="meta"><span>' + s.source + '</span><span>·</span><span>' + s.age + '</span>' +
      (s.breaking ? '<span class="pill">Breaking</span>' : '') + '</div><h3>' + s.title + '</h3><p>' + s.summary + '</p></article>').join('') +
    '</section>';
}).join('');
</script>
</body>
</html>
